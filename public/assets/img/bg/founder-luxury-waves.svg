<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" preserveAspectRatio="none" fill="none">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#52a436" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8bd63" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#cfa144" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#52a436" stop-opacity="0.02" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="70%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#52a436" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#52a436" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient background glow center -->
  <rect width="1600" height="1000" fill="url(#centerGlow)" />

  <!-- Smooth Organic Topographic & Fluid Wave Curves (Zero Boxes, Zero Straight Lines) -->
  <g fill="none" stroke-linecap="round">
    <!-- Stream 1 -->
    <path d="M-100,140 C280,80 520,320 900,180 C1240,60 1480,260 1750,140" stroke="url(#emeraldGrad)" stroke-width="1.8" />
    <path d="M-100,190 C290,130 530,370 910,230 C1250,110 1490,310 1750,190" stroke="url(#emeraldGrad)" stroke-width="1.4" opacity="0.8" />
    <path d="M-100,240 C300,180 540,420 920,280 C1260,160 1500,360 1750,240" stroke="url(#emeraldGrad)" stroke-width="1.2" opacity="0.6" />
    <path d="M-100,290 C310,230 550,470 930,330 C1270,210 1510,410 1750,290" stroke="url(#emeraldGrad)" stroke-width="1.2" opacity="0.45" />

    <!-- Stream 2 (Golden Ratio Architectural Arc) -->
    <path d="M-50,420 C360,280 680,640 1080,440 C1380,280 1550,520 1750,380" stroke="url(#goldGrad)" stroke-width="1.6" />
    <path d="M-50,470 C370,330 690,690 1090,490 C1390,330 1560,570 1750,430" stroke="url(#emeraldGrad)" stroke-width="1.3" opacity="0.7" />
    <path d="M-50,520 C380,380 700,740 1100,540 C1400,380 1570,620 1750,480" stroke="url(#emeraldGrad)" stroke-width="1.1" opacity="0.5" />
    <path d="M-50,570 C390,430 710,790 1110,590 C1410,430 1580,670 1750,530" stroke="url(#emeraldGrad)" stroke-width="1.0" opacity="0.35" />

    <!-- Stream 3 (Deep Bottom Wave Harmonics) -->
    <path d="M-80,680 C240,560 620,880 1020,720 C1340,580 1520,780 1750,660" stroke="url(#emeraldGrad)" stroke-width="1.8" />
    <path d="M-80,730 C250,610 630,930 1030,770 C1350,630 1530,830 1750,710" stroke="url(#goldGrad)" stroke-width="1.3" opacity="0.75" />
    <path d="M-80,780 C260,660 640,980 1040,820 C1360,680 1540,880 1750,760" stroke="url(#emeraldGrad)" stroke-width="1.1" opacity="0.55" />
    <path d="M-80,830 C270,710 650,1030 1050,870 C1370,730 1550,930 1750,810" stroke="url(#emeraldGrad)" stroke-width="1.0" opacity="0.35" />
    <path d="M-80,880 C280,760 660,1080 1060,920 C1380,780 1560,980 1750,860" stroke="url(#emeraldGrad)" stroke-width="0.9" opacity="0.2" />

    <!-- Organic Concentric Topo Rings around Founder Focal Area (Right Side) -->
    <ellipse cx="1180" cy="460" rx="260" ry="210" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.5" transform="rotate(-12 1180 460)" />
    <ellipse cx="1180" cy="460" rx="340" ry="275" stroke="url(#emeraldGrad)" stroke-width="1.1" opacity="0.4" transform="rotate(-12 1180 460)" />
    <ellipse cx="1180" cy="460" rx="420" ry="340" stroke="url(#emeraldGrad)" stroke-width="0.9" opacity="0.28" transform="rotate(-12 1180 460)" />
    <ellipse cx="1180" cy="460" rx="500" ry="405" stroke="url(#emeraldGrad)" stroke-width="0.8" opacity="0.18" transform="rotate(-12 1180 460)" />
  </g>
</svg>
